apiVersion: v1
items:
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        component: apiserver
        provider: kubernetes
      name: kubernetes
      namespace: default
    spec:
      clusterIP: 172.16.0.1
      clusterIPs:
        - 172.16.0.1
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: https
          port: 443
          protocol: TCP
          targetPort: 443
      sessionAffinity: None
      type: ClusterIP
kind: List
metadata:
  resourceVersion: ""
