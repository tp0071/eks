    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/created-by: eks-workshop
        app.kubernetes.io/name: data-processor
      name: data-processor
      namespace: catalog
    spec:
      backoffLimit: 3
      completionMode: NonIndexed
      completions: 1
      manualSelector: false
      parallelism: 1
      podReplacementPolicy: TerminatingOrFailed
      selector:
        matchLabels:
          batch.kubernetes.io/controller-uid: ed430be9-f145-4a72-b8fa-04e3d375a9bc
      suspend: false
      template:
        metadata:
          labels:
            app: data-processor
            batch.kubernetes.io/controller-uid: ed430be9-f145-4a72-b8fa-04e3d375a9bc
            batch.kubernetes.io/job-name: data-processor
            controller-uid: ed430be9-f145-4a72-b8fa-04e3d375a9bc
            job-name: data-processor
        spec:
          containers:
            - command:
                - /bin/sh
                - -c
                - |
                  echo "Starting data processing job..."
                  echo "Processing catalog data files..."

                  # Simulate processing multiple files
                  for i in $(seq 1 5); do
                    echo "Processing file $i/5..."
                    sleep 2
                    echo "File $i processed successfully"
                  done

                  echo "Generating summary report..."
                  cat > /tmp/processing-report.txt << EOF
                  Data Processing Report
                  =====================
                  Job: data-processor
                  Date: $(date)
                  Files processed: 5
                  Status: Completed successfully
                  EOF

                  echo "Report generated:"
                  cat /tmp/processing-report.txt
                  echo "Data processing job completed successfully!"
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              name: processor
              resources:
                limits:
                  cpu: 200m
                  memory: 256Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
